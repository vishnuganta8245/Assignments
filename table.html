<!DOCTYPE html>
<html>
<body>

<h2>Simple Dynamic Table</h2>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Age</th>
    </tr>

    {% for item in data %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.age }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
