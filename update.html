<!DOCTYPE html>
<html>
<head>
<title>Update Employee</title>
<style>
    form { width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; }
    input, select { width: 100%; padding: 8px; margin: 5px 0; }
    button { width: 100%; padding: 8px; margin-top: 10px; }
</style>
</head>

<body>

<h3 style="text-align:center;">Update Employee</h3>

<form action="{{ url_for('update_employee', emp_id=employee.id) }}" method="post">

    <label>Name:</label>
    <input type="text" name="name" value="{{ employee.name }}" required>

    <label>Salary:</label>
    <input type="number" name="salary" value="{{ employee.salary }}" required>

    <label>Role:</label>
    <select name="role" required>
        {% for role in roles %}
            <option value="{{ role.role_name }}"
                {% if role.role_name == employee.role %} selected {% endif %}>
                {{ role.role_name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Update</button>

</form>

</body>
</html>
